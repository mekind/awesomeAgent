<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent back office</title>
  <style>
    :root {
      --bg: #101218;
      --panel: #181c25;
      --line: #2c3342;
      --text: #e7ebf3;
      --muted: #8d96aa;
      --dim: #5e677a;
      --need: #f0c14a;
      --work: #7ee0a3;
      --done: #8ab4ff;
      --idle: #6b7384;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    header { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
    .counts { display: flex; gap: 14px; color: var(--muted); flex-wrap: wrap; }
    .counts b { color: var(--text); font-weight: 650; }
    .need { color: var(--need); }
    .work { color: var(--work); }
    .done { color: var(--done); }
    .banner {
      margin: 10px 20px 0;
      padding: 8px 10px;
      border: 1px solid #6a5420;
      background: #2a230f;
      color: var(--need);
      border-radius: 8px;
    }
    .problems { color: var(--muted); margin: 6px 20px 0; font-size: 12px; }
    main { padding: 8px 12px 32px; }
    .group { margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .group h2 {
      margin: 0;
      padding: 8px 12px;
      background: var(--panel);
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .group h2 .path, .group h2 .meta { color: var(--dim); font-weight: 450; font-size: 12px; }
    .row {
      display: grid;
      grid-template-columns: 18px 64px minmax(180px, 1.4fr) 88px minmax(160px, 1fr) 72px 64px;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      align-items: start;
    }
    .row.idle { opacity: 0.55; }
    .row.needs_you { background: #2a230f; }
    .row:hover { background: #222836; }
    .glyph { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .vendor { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
    .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .src, .sub {
      color: var(--dim);
      font-size: 11px;
      margin-left: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 6px;
    }
    .reason { color: var(--muted); }
    .when { color: var(--dim); font-variant-numeric: tabular-nums; }
    .editor, .detail { padding: 8px 12px 12px 38px; background: #141820; border-top: 1px solid var(--line); }
    label { display: block; color: var(--muted); font-size: 11px; margin: 8px 0 4px; }
    input[type=text] {
      width: min(720px, 100%);
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      font: inherit;
    }
    button {
      background: #2a3344;
      color: var(--text);
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
    }
    .todo { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    .muted { color: var(--dim); }
    details { margin: 14px 8px; }
    summary { cursor: pointer; color: var(--muted); }
    .history-row { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .runline { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .runs { margin: 8px 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .run-card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .run-head {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: baseline;
      margin: 0 0 6px;
      font-size: 12px;
    }
    .run-head .n { font-weight: 650; }
    .run-card p { margin: 3px 0; }
    .k { color: var(--dim); }
    .asks { margin: 2px 0 6px; padding-left: 18px; }
    .check { margin: 4px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .delegate {
      display: grid;
      grid-template-columns: 16px 78px minmax(120px, 1.2fr) minmax(80px, 0.8fr) 88px minmax(120px, 1fr);
      gap: 6px;
      padding: 2px 0;
    }
    .delegate > span { min-width: 0; }
    .report { word-break: break-all; }
    .run-warn { font-size: 12px; }
    a { color: var(--done); }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Agent back office</h1>
    <div class="counts" id="counts">loading…</div>
  </header>
  <div id="banner"></div>
  <div class="problems" id="problems"></div>
  <main id="main"></main>
  <script>
    let board = null;
    let openKey = null;
    let runsTimer = null;
    const $ = (id) => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    const GLYPH = { needs_you: "▲", working: "●", done: "✓", idle: "○" };
    const LABEL = { needs_you: "needs you", working: "working", done: "your move", idle: "idle" };
    const RUN_LABEL = {
      needs_you: "needs you", working: "working", waiting: "waiting",
      your_move: "your move", interrupted: "interrupted", ended: "ended"
    };
    const DGLYPH = { needs_you: "▲", running: "●", failed: "✕", done: "✓", unknown: "·" };

    function runLine(run) {
      const book = run.playbook ? run.playbook.title + " (" + run.playbook.evidence + ")" : "playbook not recorded";
      const trail = run.trail && run.trail.length > 1 ? run.trail.join(" → ") : book;
      return "run " + run.n + " of " + run.count + " · " + trail + " · " + (run.reason || run.state);
    }
    const SRC = { board: "board", "orca-task": "task", "vendor-title": "title", prompt: "prompt" };

    function rel(iso) {
      if (!iso) return "";
      const then = Date.parse(iso);
      if (Number.isNaN(then)) return "";
      const sec = Math.max(0, (Date.now() - then) / 1000);
      if (sec < 45) return "just now";
      if (sec < 3600) return Math.floor(sec / 60) + "m";
      if (sec < 86400) return Math.floor(sec / 3600) + "h";
      return Math.floor(sec / 86400) + "d";
    }

    function hhmm(iso) {
      const then = Date.parse(iso);
      if (Number.isNaN(then)) return "";
      const date = new Date(then);
      return String(date.getHours()).padStart(2, "0") + ":" + String(date.getMinutes()).padStart(2, "0");
    }

    function color(vendor) {
      return (board && board.vendors && board.vendors[vendor]) || "#e7ebf3";
    }

    function rowHtml(agent, depth) {
      const goal = agent.goal;
      const progress = agent.progress;
      const latest = agent.latest;
      const pad = 12 + depth * 16;
      return `
        <div class="row ${esc(agent.status)}" data-key="${esc(agent.key)}" style="padding-left:${pad}px">
          <div class="glyph">${GLYPH[agent.status] || "·"}</div>
          <div class="vendor" style="color:${esc(color(agent.vendor))}">${esc(agent.vendor)}</div>
          <div>
            <div class="clip">${goal ? esc(goal.text) : '<span class="muted">goal?</span>'}
              ${goal ? `<span class="src">${esc(SRC[goal.source] || goal.source)}</span>` : ""}
              ${agent.missing ? '<span class="src">missing</span>' : ""}
            </div>
            ${agent.run ? `<div class="runline clip">${esc(runLine(agent.run))}</div>` : ""}
          </div>
          <div>${progress ? esc(progress.done + "/" + progress.total) : "·"}${progress ? `<span class="src">${esc(progress.source)}</span>` : ""}</div>
          <div class="reason clip">${esc(LABEL[agent.status] || agent.status)} · ${esc(agent.reason || "")}</div>
          <div>${esc(agent.presence)}</div>
          <div class="when">${esc(rel(agent.last_activity))}</div>
        </div>
        <div class="fold" data-fold="${esc(agent.key)}" ${openKey === agent.key ? "" : "hidden"}></div>`;
    }

    function fillFold(agent, root) {
      const scope = root || document;
      const fold = scope.querySelector(`[data-fold="${CSS.escape(agent.key)}"]`);
      if (!fold) return;
      const detail = agent.detail || {};
      const bits = [];
      bits.push(`<div class="muted">${esc(agent.key)}${detail.cwd ? " · " + esc(detail.cwd) : ""} · ${esc(agent.status_source)}</div>`);
      if (detail.last_prompt) bits.push(`<div><span class="muted">you</span> ${esc(detail.last_prompt.text)}</div>`);
      if (detail.last_reply) bits.push(`<div><span class="muted">reply</span> ${esc(detail.last_reply.text)}</div>`);
      if (agent.run) bits.push(`<div id="runs-${sidOf(agent)}" class="runs"><div class="muted">loading runs…</div></div>`);
      if (agent.editable) {
        const sid = agent.key.replace(/[^a-zA-Z0-9_-]/g, "_");
        const todos = (detail.todos || []);
        bits.push(`
          <div class="editor">
            <label>board goal</label>
            <input type="text" id="goal-${sid}" value="${esc(agent.goal && agent.goal.source === "board" ? agent.goal.text : (detail.todos ? "" : ""))}" placeholder="what this session is finishing" />
            <div style="margin-top:8px"><button data-act="save-goal">Save goal</button></div>
            <label>todos</label>
            <div id="todos-${sid}">
              ${todos.map((todo, i) => `<div class="todo"><input type="checkbox" data-i="${i}" ${todo.done ? "checked" : ""}/><input type="text" data-i="${i}" value="${esc(todo.text)}"/></div>`).join("")}
            </div>
            <div class="todo"><input type="text" id="newtodo-${sid}" placeholder="add a todo"/><button data-act="add-todo">Add</button></div>
          </div>`);
      }
      fold.innerHTML = `<div class="detail">${bits.join("")}</div>`;
      fold.querySelectorAll("input, button").forEach((el) => el.addEventListener("click", (event) => event.stopPropagation()));
      const save = fold.querySelector("[data-act=save-goal]");
      if (save) save.onclick = (event) => { event.stopPropagation(); saveGoal(agent); };
      const add = fold.querySelector("[data-act=add-todo]");
      if (add) add.onclick = (event) => { event.stopPropagation(); addTodo(agent); };
      fold.querySelectorAll("#todos-" + sidOf(agent) + " input").forEach((input) => {
        input.addEventListener("change", (event) => { event.stopPropagation(); saveTodos(agent); });
      });
      if (agent.run) startRuns(agent.key);
    }

    function chip(text, detail) {
      if (!text) return "";
      const hover = detail ? ` title="${esc(detail)}"` : "";
      return `<span class="src"${hover}>${esc(text)}</span>`;
    }

    function checkLine(step) {
      const mark = String(step.mark || "").toLowerCase();
      const text = step.text || "";
      if (mark === "done" || mark === "x") return `[x] ${text}`;
      if (mark === "skipped" || mark === "-" || mark === "skip") {
        return /skip\s*:/i.test(text) ? `[-] ${text}` : `[-] skip ${text}`;
      }
      return `[ ] ${text}`;
    }

    function delegateResult(item) {
      const result = item && item.result;
      if (!result) return "result not observed";
      if (typeof result === "string") return result;
      return result.text || "result not observed";
    }

    function renderRuns(runs) {
      const list = Array.isArray(runs) ? runs.slice() : [];
      list.sort((a, b) => {
        const na = Number(a && a.n);
        const nb = Number(b && b.n);
        if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return nb - na;
        return String((b && b.started_at) || "").localeCompare(String((a && a.started_at) || ""));
      });
      if (!list.length) return `<div class="muted">no poteto runs in this session</div>`;
      return list.map((run) => {
        const live = run.state === "working" || run.state === "waiting" || run.state === "needs_you";
        const result = run.result || {};
        const headline = result.headline;
        const headlineText = headline && typeof headline === "object"
          ? (headline.text || "result not observed")
          : (headline ? String(headline) : "result not observed");
        const headlineSource = typeof headline === "object" && headline
          ? (headline.source || result.source)
          : result.source;
        const book = run.playbook;
        const asks = run.asks || [];
        const request = run.request && run.request.text ? run.request.text : "";
        const started = hhmm(run.started_at);
        const progress = run.progress;
        const trail = run.trail || [];
        const steps = run.checklist && run.checklist.steps;
        const head = [
          `<span class="n">#${esc(run.n)}</span>`,
          started ? `<span class="when">${esc(started)}</span>` : "",
          `<span>${esc(RUN_LABEL[run.state] || run.state)}</span>`,
          run.reason ? `<span class="reason">${esc(run.reason)}</span>` : "",
          book
            ? `<span>${esc(book.title)}</span>${chip(book.evidence, book.detail)}`
            : `<span class="muted">playbook not recorded</span>`,
          progress ? `<span>${esc(progress.done + "/" + progress.total)}</span>${chip(progress.source)}` : "",
          asks.length ? `<span class="muted">+${esc(asks.length)} follow-ups</span>` : ""
        ].filter(Boolean).join("");
        const askList = asks.length
          ? `<ul class="asks muted">${asks.map((ask) => `<li>${esc(ask.text)}</li>`).join("")}</ul>`
          : "";
        const trailHtml = trail.length > 1
          ? `<p>${trail.map((hit) => `${esc(hit.title)} ${chip(hit.evidence, hit.detail)}`).join(" → ")}</p>`
          : "";
        const checkHtml = steps && steps.length
          ? `<div class="check">${steps.map((step) => `<div>${esc(checkLine(step))}</div>`).join("")}</div>`
          : "";
        const delegates = (run.delegates || []).map((item) => {
          const text = delegateResult(item);
          const report = item.report
            ? `<div class="muted report">${esc(item.report)}</div>`
            : "";
          return `<div class="delegate"><span class="glyph">${DGLYPH[item.state] || "·"}</span><span>${esc(item.kind)}</span><span class="clip" title="${esc(item.title)}">${esc(item.title)}</span><span class="muted clip">${esc(item.who)}</span><span>${esc(item.state)}</span><span class="muted clip" title="${esc(text)}">${esc(text)}</span></div>${report}`;
        }).join("");
        const warnings = (run.roster || []).filter((item) => item.status !== "known").map((item) => {
          return `<p class="muted run-warn">${esc(item.id)} · ${esc(item.reason || item.status)}</p>`;
        }).join("");
        const prs = (result.prs || []).map((pr) => {
          return `<a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.repo || "pr")} #${esc(pr.number)}</a>`;
        }).join(" ");
        return `<article class="run-card">
          <div class="run-head">${head}</div>
          ${request ? `<p class="clip" title="${esc(request)}">${esc(request)}</p>` : ""}
          ${askList}
          ${trailHtml}
          ${checkHtml}
          ${delegates}
          ${warnings}
          <p><span class="k">${live ? "latest" : "result"}</span> ${esc(headlineText)}${headlineSource ? ` ${chip(headlineSource)}` : ""}</p>
          ${prs ? `<p>${prs}</p>` : ""}
        </article>`;
      }).join("");
    }

    function stopRuns() {
      if (runsTimer) {
        clearInterval(runsTimer);
        runsTimer = null;
      }
    }

    async function loadRuns(key) {
      const slot = document.getElementById("runs-" + key.replace(/[^a-zA-Z0-9_-]/g, "_"));
      if (!slot || openKey !== key) return;
      try {
        const response = await fetch("/api/runs?key=" + encodeURIComponent(key));
        if (!response.ok) {
          slot.textContent = "runs unavailable";
          return;
        }
        const body = await response.json();
        if (openKey !== key) return;
        slot.innerHTML = renderRuns(body.runs || []);
      } catch (err) {
        slot.textContent = "runs refresh failed";
      }
    }

    function startRuns(key) {
      stopRuns();
      loadRuns(key);
      runsTimer = setInterval(() => {
        if (!openKey || document.hidden) return;
        loadRuns(openKey);
      }, 5000);
    }

    function renderAgents(parent, agents, depth) {
      for (const agent of agents) {
        if (agent.delegate_of) {
          if (agent.children && agent.children.length) renderAgents(parent, agent.children, depth);
          continue;
        }
        parent.insertAdjacentHTML("beforeend", rowHtml(agent, depth));
        if (agent.children && agent.children.length) renderAgents(parent, agent.children, depth + 1);
      }
    }

    function render() {
      const counts = board.counts || {};
      const needs = counts.needs_you || 0;
      document.title = (needs ? `(${needs}) ` : "") + "Agent back office";
      $("title").textContent = "Agent back office";
      $("counts").innerHTML = `
        <span class="need"><b>${needs}</b> need you</span>
        <span class="work"><b>${counts.working || 0}</b> working</span>
        <span class="done"><b>${counts.done || 0}</b> your move</span>
        <span><b>${counts.idle || 0}</b> idle</span>
        <span class="muted">${board.orca && board.orca.up ? "Orca up" : "Orca offline"} · ${esc(board.took_ms)} ms</span>`;
      $("banner").innerHTML = board.orca && board.orca.up ? "" : '<div class="banner">Orca offline: live state estimated from file activity</div>';
      const problems = (board.orca && board.orca.problems) || [];
      $("problems").textContent = problems.join(" · ");
      const main = $("main");
      main.innerHTML = "";
      for (const group of board.groups || []) {
        const section = document.createElement("section");
        section.className = "group";
        section.innerHTML = `<h2><span class="glyph">${GLYPH[group.status] || "·"}</span> ${esc(group.name)} <span class="path">${esc(group.path)}</span> <span class="meta">${esc(group.orca_status || "")}</span></h2>`;
        renderAgents(section, group.agents || [], 0);
        // The section is detached while rows are inserted, and the runs poll uses getElementById.
        main.appendChild(section);
        if (openKey) {
          const opened = findAgent(openKey, group.agents);
          if (opened) fillFold(opened, section);
        }
      }
      const history = board.history || [];
      const hidden = counts.hidden_spawned || 0;
      const box = document.createElement("details");
      box.innerHTML = `<summary>History · ${history.length} sessions · ${hidden} spawned runs hidden</summary>`;
      for (const agent of history) {
        const goal = agent.goal ? agent.goal.text : agent.key;
        const row = document.createElement("div");
        row.className = "history-row";
        row.textContent = `${agent.vendor}  ${goal}`;
        box.appendChild(row);
      }
      main.appendChild(box);
      main.querySelectorAll(".row").forEach((row) => {
        row.addEventListener("click", () => {
          openKey = openKey === row.dataset.key ? null : row.dataset.key;
          if (!openKey) stopRuns();
          render();
        });
      });
    }

    function sidOf(agent) {
      return agent.key.replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    async function saveGoal(agent) {
      const text = document.getElementById("goal-" + sidOf(agent)).value.trim();
      await fetch("/api/goal", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key: agent.key, text })
      });
      await reload();
    }

    function collectTodos(agent) {
      const root = document.getElementById("todos-" + sidOf(agent));
      const existing = (agent.detail && agent.detail.todos) || [];
      return [...root.querySelectorAll(".todo")].map((row, index) => ({
        id: (existing[index] && existing[index].id) || String(index + 1),
        text: row.querySelector("input[type=text]").value,
        done: row.querySelector("input[type=checkbox]").checked
      })).filter((todo) => todo.text.trim());
    }

    async function saveTodos(agent) {
      await fetch("/api/todos", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key: agent.key, todos: collectTodos(agent) })
      });
      openKey = agent.key;
      await reload();
    }

    async function addTodo(agent) {
      const input = document.getElementById("newtodo-" + sidOf(agent));
      const text = input.value.trim();
      if (!text) return;
      const todos = ((agent.detail && agent.detail.todos) || []).concat([{ id: crypto.randomUUID(), text, done: false }]);
      await fetch("/api/todos", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key: agent.key, todos })
      });
      openKey = agent.key;
      await reload();
    }

    function findAgent(key, nodes) {
      for (const agent of nodes || []) {
        if (agent.key === key) return agent;
        const child = findAgent(key, agent.children);
        if (child) return child;
      }
      return null;
    }

    async function reload() {
      const response = await fetch("/api/board");
      board = await response.json();
      render();
    }

    async function tick() {
      if (document.hidden || openKey) return;
      try { await reload(); } catch (err) { $("counts").textContent = "refresh failed"; }
    }

    reload();
    setInterval(tick, 5000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
